<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KiRA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
      * {
      margin: 0;
      padding: 0;
      box-sizing: border-abox;
      font-family: Arial, Helvetica, sans-serif;
      }
      body {
      background: #1e2a38;
      background-image: url("{{ url_for('static', filename='images/bg.jpeg') }}");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      position: relative;
      }
      .navbar {
      width: 100%;
      background-color: rgba(36, 52, 71, 0.9); /* Transparent background */
      padding: 20px 50px; /* Increased padding for bigger navbar */
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      position: fixed;
      top: 0;
      z-index: 10;
      }
      .navbar .logo {
      font-size: 24px; /* Slightly bigger logo */
      font-weight: bold;
      color: #38ef7d;
      text-decoration: none;
      }
      .navbar ul {
      list-style: none;
      display: flex;
      gap: 20px;
      }
      .navbar ul li {
      display: inline-block;
      }
      .navbar ul li a {
      text-decoration: none;
      color: white;
      padding: 10px 15px;
      border-radius: 5px;
      transition: background 0.3s ease;
      }
      .navbar ul li a:hover {
      background: #38ef7d;
      color: #1e2a38;
      }
      .wrapper {
      width: 420px; /* Increased width */
      background: rgba(255, 255, 255, 0.1); /* Lighter transparent background */
      backdrop-filter: blur(10px);
      padding: 40px 50px; /* Increased padding */
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.2);
      margin-top: 120px; /* Adjusted margin for bigger navbar */
      text-align: center;
      }
      h1 {
      margin-bottom: 20px;
      font-size: 24px;
      color: white;
      }
      .input-box {
      position: relative;
      margin-bottom: 20px;
      }
      .input-box input {
      width: 100%;
      padding: 12px 35px 12px 15px;
      border: none;
      border-radius: 50px;
      background: rgba(30, 42, 56, 0.8); /* Slightly transparent input background */
      color: white;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
      }
      .input-box input:focus {
      transform: scale(1.05);
      box-shadow: inset 5px 5px 10px rgba(0, 0, 0, 0.9), inset -5px -5px 10px rgba(255, 255, 255, 0.2);
      }
      .input-box i {
      position: absolute;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      color: white;
      font-size: 20px;
      }
      .Remember-Forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 14px;
      }
      .Remember-Forgot label {
      display: flex;
      align-items: center;
      }
      .Remember-Forgot a {
      text-decoration: none;
      color: #38ef7d;
      transition: color 0.3s ease;
      }
      .Remember-Forgot a:hover {
      color: #11998e;
      }
      .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(to right, #11998e, #38ef7d);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
      }
      .btn:hover {
      background: linear-gradient(to right, #38ef7d, #11998e);
      transform: scale(1.05);
      }
      .register-link {
      margin-top: 20px;
      font-size: 14px;
      }
      .register-link a {
      text-decoration: none;
      color: #38ef7d;
      transition: color 0.3s ease;
      }
      .register-link a:hover {
      color: #11998e;
      }
      @keyframes fadeIn {
      0% {
      opacity: 0;
      }
      100% {
      opacity: 1;
      }
      }
      @keyframes fadeInUp {
      0% {
      opacity: 0;
      transform: translateY(20px);
      }
      100% {
      opacity: 1;
      transform: translateY(0);
      }
      }
      /* Toast Notification Styles */
      .toast-container {
        position: fixed;
        top: 100px;
        right: 20px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .toast {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 16px 20px;
        border-radius: 12px;
        border-left: 4px solid #38ef7d;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 300px;
        max-width: 400px;
        animation: slideInRight 0.4s ease-out;
        position: relative;
      }
      .toast.success {
        border-left-color: #38ef7d;
      }
      .toast.error {
        border-left-color: #ef4444;
      }
      .toast.warning {
        border-left-color: #f59e0b;
      }
      .toast-icon {
        font-size: 24px;
        flex-shrink: 0;
      }
      .toast.success .toast-icon {
        color: #38ef7d;
      }
      .toast.error .toast-icon {
        color: #ef4444;
      }
      .toast.warning .toast-icon {
        color: #f59e0b;
      }
      .toast-message {
        color: #1e2a38;
        font-size: 14px;
        flex: 1;
        line-height: 1.4;
      }
      .toast-close {
        background: none;
        border: none;
        color: #64748b;
        cursor: pointer;
        font-size: 20px;
        padding: 0;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        transition: all 0.2s;
        flex-shrink: 0;
      }
      .toast-close:hover {
        background: rgba(0, 0, 0, 0.1);
        color: #1e2a38;
      }
      @keyframes slideInRight {
        from {
          transform: translateX(400px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      @keyframes slideOutRight {
        from {
          transform: translateX(0);
          opacity: 1;
        }
        to {
          transform: translateX(400px);
          opacity: 0;
        }
      }
      /* Loading Spinner */
      .btn.loading {
        position: relative;
        pointer-events: none;
        opacity: 0.7;
      }
      .btn.loading::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        top: 50%;
        left: 50%;
        margin-left: -8px;
        margin-top: -8px;
        border: 2px solid #ffffff;
        border-radius: 50%;
        border-top-color: transparent;
        animation: spinner 0.6s linear infinite;
      }
      @keyframes spinner {
        to {
          transform: rotate(360deg);
        }
      }

      /* Social Login Divider */
      .divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 20px 0;
        color: #94a3b8;
        font-size: 14px;
      }

      .divider::before,
      .divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .divider span {
        padding: 0 15px;
        font-weight: 500;
      }

      /* Google Sign-In Button */
      .g_id_signin {
        margin: 15px 0 !important;
        display: flex;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <!-- Navigation Bar -->
<div class="navbar">
  <a href="#" class="logo">KIIT Intelligent Responsive Assistant</a>
  <ul>
    <li><a href="{{ url_for('about') }}">About us</a></li>
    <li><a href="{{ url_for('contact') }}">Contact</a></li>
  </ul>
</div>

<!-- Login Form -->
<div class="wrapper">
  <form id="login-form">
    <h1>Login</h1>
    <!-- Add CSRF Token -->
    <input type="hidden" id="csrf_token" name="csrf_token" value="{{ csrf_token() }}">
    
        <div class="input-box">
          <input type="email" id="email" name="email" placeholder="Email (@kiit.ac.in)" required pattern="[a-zA-Z0-9._%+-]+@kiit\.ac\.in$">
          <i class='bx bxs-envelope'></i>
        </div>
    <div class="input-box">
      <input type="password" id="password" name="password" placeholder="Password" required>
      <i class='bx bxs-lock-alt'></i>
    </div>
    <div class="Remember-Forgot">
      <label><input type="checkbox" id="remember-me" name="remember-me"> Remember me</label>
      <p><a href="{{ url_for('forgot_password') }}">Forgot Password</a></p>
    </div>
    <button type="submit" class="btn">Login</button>
    
    <!-- Social Login Divider (Hidden until OAuth is configured) -->
    <div class="divider" style="display: none;">
      <span>OR</span>
    </div>
    
    <!-- Google OAuth Button (Hidden until OAuth is configured) -->
    <div id="g_id_onload" style="display: none;"
         data-client_id="YOUR_ACTUAL_GOOGLE_CLIENT_ID_HERE"
         data-callback="handleGoogleLogin"
         data-auto_prompt="false">
    </div>
    <div class="g_id_signin" style="display: none;"
         data-type="standard"
         data-size="large"
         data-theme="filled_black"
         data-text="signin_with"
         data-shape="rectangular"
         data-logo_alignment="left"
         data-width="100%">
    </div>
    
    <div class="register-link">
      <p>Don't have an account? <a href="/register-page">Register here</a></p>
    </div>
  </form>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<!-- Google Sign-In Library -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
  // Toast notification function
  function showToast(message, type = 'success') {
    const toastContainer = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    
    const icons = {
      success: '✓',
      error: '✕',
      warning: '⚠'
    };
    
    toast.innerHTML = `
      <span class="toast-icon">${icons[type] || icons.success}</span>
      <span class="toast-message">${message}</span>
      <button class="toast-close" onclick="closeToast(this)">×</button>
    `;
    
    toastContainer.appendChild(toast);
    
    // Auto remove after 5 seconds
    setTimeout(() => {
      toast.style.animation = 'slideOutRight 0.4s ease-out';
      setTimeout(() => toast.remove(), 400);
    }, 5000);
  }
  
  function closeToast(button) {
    const toast = button.parentElement;
    toast.style.animation = 'slideOutRight 0.4s ease-out';
    setTimeout(() => toast.remove(), 400);
  }

  // Google OAuth Handler
  function handleGoogleLogin(response) {
    const credential = response.credential;
    
    // Show loading
    showToast('Signing in with Google...', 'success');
    
    // Send credential to backend
    $.ajax({
      type: "POST",
      url: "/auth/google",
      contentType: "application/json",
      data: JSON.stringify({ credential: credential }),
      success: function (response) {
        if (response.success) {
          showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = response.redirect;
          }, 1000);
        } else {
          showToast(response.message || 'Google login failed', 'error');
        }
      },
      error: function (xhr, status, error) {
        console.error("Google login error:", error);
        showToast('Google login failed. Please try again.', 'error');
      }
    });
  }

  $(document).ready(function () {
    // Handle login form submission using AJAX
    $("#login-form").submit(function (event) {
      event.preventDefault();

      var email = $("#email").val();
      var password = $("#password").val();
      var remember_me = $("#remember-me").is(':checked');
      var csrf_token = $("#csrf_token").val();
      
      // Email validation
      if (!email.endsWith('@kiit.ac.in')) {
        showToast('Please use your KIIT University email ID (@kiit.ac.in)', 'warning');
        return;
      }
      
      // Add loading state
      var submitBtn = $(".btn");
      submitBtn.addClass("loading").text("");

      // Send the email, password, and CSRF token as JSON data to the backend
      $.ajax({
        type: "POST",
        url: "/login",  // Endpoint for login
        contentType: "application/json",
        headers: {
          "X-CSRFToken": csrf_token,  // Include CSRF token in headers
        },
        data: JSON.stringify({ email: email, password: password, remember_me: remember_me }),
        success: function (response) {
          submitBtn.removeClass("loading").text("Login");
          if (response.success) {
            showToast('Login successful! Redirecting...', 'success');
            // Redirect to chat page after a short delay
            setTimeout(() => {
              window.location.href = response.redirect;
            }, 1000);
          } else {
            showToast(response.message, 'error');
          }
        },
        error: function (xhr) {
          submitBtn.removeClass("loading").text("Login");
          const message = xhr.responseJSON?.message || "An error occurred during login. Please try again.";
          showToast(message, 'error');
        }
      });
    });
  });
</script>

  </body>
</html>
