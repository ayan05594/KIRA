<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
      /* General Styles */
      body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #1e2a38;
      background-image: url("{{ url_for('static', filename='images/bg.jpeg') }}");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      }
      .container {
      width: 100%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.2);
      }
      h1 {
      text-align: center;
      color: #fff;
      margin-bottom: 20px;
      }
      .input-box {
      position: relative;
      margin-bottom: 20px;
      }
      .input-field {
      width: 100%;
      padding: 10px;
      padding-left: 40px;
      border: 2px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
      color: #333;
      }
      .input-box i {
      position: absolute;
      top: 50%;
      right: 10px; /* Move icon to the right */
      transform: translateY(-50%);
      font-size: 18px;
      color: #888;
      }
      .checkbox-container {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      }
      .checkbox-container input {
      margin-right: 10px;
      }
      button {
      width: 100%;
      padding: 15px;
      background-color: #38ef7d;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s ease-in-out;
      }
      button:hover {
      background-color: #38ef7d;
      }
      .form-footer {
      text-align: center;
      margin-top: 20px;
      }
      .form-footer a {
      color: #38ef7d;
      text-decoration: none;
      }
      .form-footer a:hover {
      text-decoration: underline;
      }
      /* Keyframes for Animation */
      @keyframes fadeInUp {
      0% {
      opacity: 0;
      transform: translateY(20px);
      }
      100% {
      opacity: 1;
      transform: translateY(0);
      }
      }
      .container {
      animation: fadeInUp 0.8s ease-in-out;
      }

      /* Toast Notification Styles */
      .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      }

      .toast {
      background: rgba(36, 52, 71, 0.95);
      backdrop-filter: blur(10px);
      color: white;
      padding: 16px 24px;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 300px;
      max-width: 400px;
      animation: slideInRight 0.3s ease-out;
      border-left: 4px solid #38ef7d;
      }

      .toast.success {
      border-left-color: #38ef7d;
      }

      .toast.error {
      border-left-color: #ef4444;
      }

      .toast.warning {
      border-left-color: #f59e0b;
      }

      .toast-icon {
      font-size: 24px;
      flex-shrink: 0;
      }

      .toast.success .toast-icon {
      color: #38ef7d;
      }

      .toast.error .toast-icon {
      color: #ef4444;
      }

      .toast.warning .toast-icon {
      color: #f59e0b;
      }

      .toast-message {
      flex: 1;
      font-size: 14px;
      line-height: 1.5;
      }

      .toast-close {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      font-size: 20px;
      padding: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
      }

      .toast-close:hover {
      color: white;
      }

      @keyframes slideInRight {
      from {
      transform: translateX(400px);
      opacity: 0;
      }
      to {
      transform: translateX(0);
      opacity: 1;
      }
      }

      @keyframes slideOutRight {
      from {
      transform: translateX(0);
      opacity: 1;
      }
      to {
      transform: translateX(400px);
      opacity: 0;
      }
      }

      .toast.hiding {
      animation: slideOutRight 0.3s ease-in forwards;
      }
      /* Password strength indicator */
      .password-strength {
        margin-top: 5px;
        height: 4px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
        overflow: hidden;
      }
      .password-strength-bar {
        height: 100%;
        width: 0%;
        transition: all 0.3s;
      }
      .password-strength-bar.weak {
        width: 33%;
        background: #ef4444;
      }
      .password-strength-bar.medium {
        width: 66%;
        background: #f59e0b;
      }
      .password-strength-bar.strong {
        width: 100%;
        background: #38ef7d;
      }
      .password-hint {
        font-size: 12px;
        margin-top: 5px;
        margin-bottom: 15px;
        color: rgba(255, 255, 255, 0.9);
      }
    </style>
  </head>
  <body>
    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>

    <div class="container">
      <h1>Register</h1>
      <form id="register-form" onsubmit="return false;">
        <!-- Full Name -->
        <div class="input-box">
          <input type="text" id="name" name="name" placeholder="Full Name" required>
          <i class='bx bxs-user'></i>
        </div>
        <!-- Email -->
        <div class="input-box">
          <input type="email" id="email" name="email" placeholder="Email (@kiit.ac.in only)" required pattern="[a-zA-Z0-9._%+-]+@kiit\.ac\.in$">
          <i class='bx bxs-envelope'></i>
          <span class="email-hint" style="font-size: 11px; color: #94a3b8; margin-top: 4px; display: block;">Only @kiit.ac.in emails are allowed</span>
        </div>
        <!-- KIIT Roll Number -->
        <div class="input-box">
          <input type="text" id="roll-number" name="roll-number" placeholder="KIIT Roll Number" required>
          <i class='bx bxs-id-card'></i>
        </div>
        <!-- Password -->
        <div class="input-box">
          <input type="password" id="password" name="password" placeholder="Password (min 8 characters)" required minlength="8">
          <i class='bx bxs-lock-alt'></i>
        </div>
        <div class="password-strength">
          <div class="password-strength-bar" id="strengthBar"></div>
        </div>
        <div class="password-hint" id="passwordHint">
          Password must be at least 8 characters
        </div>
        <!-- Confirm Password -->
        <div class="input-box">
          <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm Password" required>
          <i class='bx bxs-lock-alt'></i>
        </div>
        <!-- Terms and Conditions -->
        <div class="checkbox-container">
          <input type="checkbox" id="terms" name="terms" required>
          <label for="terms">I agree to the <a href="#">terms and conditions</a>.</label>
        </div>
        <!-- Submit Button -->
        <button type="button" id="send-otp">Send OTP</button>
        <!-- OTP Section (Initially Hidden) -->
        <div id="otp-section" style="display: none;">
          <div class="input-box">
            <input type="text" id="otp" name="otp" placeholder="Enter OTP" required>
            <i class='bx bxs-key'></i>
          </div>
          <button type="button" id="verify-otp">Verify OTP</button>
        </div>
      </form>
      <!-- Footer -->
      <div class="form-footer">
        <p>Already have an account? <a href="/">Login here</a></p>
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
      // Toast Notification Function
      function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        
        const icons = {
          success: '<i class="bx bx-check-circle"></i>',
          error: '<i class="bx bx-error-circle"></i>',
          warning: '<i class="bx bx-error"></i>'
        };
        
        toast.innerHTML = `
          <span class="toast-icon">${icons[type]}</span>
          <span class="toast-message">${message}</span>
          <button class="toast-close" onclick="closeToast(this)">×</button>
        `;
        
        container.appendChild(toast);
        
        // Auto remove after 5 seconds
        setTimeout(() => {
          closeToast(toast.querySelector('.toast-close'));
        }, 5000);
      }
      
      function closeToast(button) {
        const toast = button.closest('.toast');
        toast.classList.add('hiding');
        setTimeout(() => {
          toast.remove();
        }, 300);
      }

      // Password strength checker
      function checkPasswordStrength(password) {
        const strengthBar = document.getElementById('strengthBar');
        const passwordHint = document.getElementById('passwordHint');
        
        let strength = 0;
        const hints = [];
        
        if (password.length >= 8) strength++;
        else hints.push('at least 8 characters');
        
        if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
        else hints.push('uppercase & lowercase');
        
        if (/\d/.test(password)) strength++;
        else hints.push('numbers');
        
        if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) strength++;
        else hints.push('special characters');
        
        // Update UI
        strengthBar.className = 'password-strength-bar';
        if (strength <= 1) {
          strengthBar.classList.add('weak');
          passwordHint.textContent = 'Weak password. Add: ' + hints.join(', ');
          passwordHint.style.color = '#ef4444';
        } else if (strength === 2 || strength === 3) {
          strengthBar.classList.add('medium');
          passwordHint.textContent = 'Medium strength. Consider: ' + hints.join(', ');
          passwordHint.style.color = '#f59e0b';
        } else {
          strengthBar.classList.add('strong');
          passwordHint.textContent = 'Strong password! ✓';
          passwordHint.style.color = '#38ef7d';
        }
        
        return strength;
      }

      // Add real-time password strength checking
      $(document).ready(function () {
      $('#password').on('input', function() {
        checkPasswordStrength($(this).val());
      });

      $("#send-otp").click(function () {
      var name = $("#name").val().trim();
      var email = $("#email").val().trim();
      var rollNumber = $("#roll-number").val().trim();
      var password = $("#password").val().trim();
      var confirmPassword = $("#confirm-password").val().trim();
      
      // Check if all fields are filled
      if (!name || !email || !rollNumber || !password || !confirmPassword) {
        showToast("Please fill all fields.", "warning");
        return;
      }
      
      // Validate KIIT email
      if (!email.endsWith("@kiit.ac.in")) {
        showToast("Please enter a valid KIIT email (ending with @kiit.ac.in).", "error");
        return;
      }
      
      // Check password strength
      const passwordStrength = checkPasswordStrength(password);
      if (passwordStrength < 2) {
        showToast("Please use a stronger password (at least 8 characters with uppercase, lowercase, and numbers).", "warning");
        return;
      }
      
      // Check if passwords match
      if (password !== confirmPassword) {
        showToast("Passwords do not match.", "error");
        return;
      }
      
      // Send OTP request
      $.ajax({
        type: "POST",
        url: "/send-otp",
        contentType: "application/json",
        data: JSON.stringify({ email: email }),
        success: function (response) {
          if (response.success) {
            showToast("OTP sent to your email.", "success");
            $("#send-otp").hide(); // Hide the "Send OTP" button
            $("#otp-section").show(); // Show the OTP input field and "Verify OTP" button
          } else {
            showToast(response.message, "error"); // Display error message
          }
        },
        error: function (xhr) {
          showToast("Error: " + xhr.responseJSON.message, "error");
        },
      });
      function showWarning(inputField, message) {
      var input = $(inputField);
      input.focus();
      input[0].setCustomValidity(message);
      input[0].reportValidity();
      setTimeout(() => input[0].setCustomValidity(""), 3000); // Remove warning after 3 seconds
      }
      });
      
      
      // VERIFY OTP FUNCTIONALITY
      $("#verify-otp").click(function () {
      var name = $("#name").val().trim();
      var email = $("#email").val().trim();
      var rollNumber = $("#roll-number").val().trim();
      var password = $("#password").val().trim();
      var confirmPassword = $("#confirm-password").val().trim();
      var otp = $("#otp").val().trim();
      
      // Validate all fields before verification
      if (!name || !email || !rollNumber || !password || !confirmPassword || !otp) {
        showToast("Please fill in all fields.", "warning");
        return;
      }
      
      // Check if passwords match
      if (password !== confirmPassword) {
        showToast("Passwords do not match.", "error");
        return;
      }
      
      // Validate KIIT email
      if (!email.endsWith("@kiit.ac.in")) {
        showToast("Please enter a valid KIIT email (ending with @kiit.ac.in).", "error");
        return;
      }
      
      // Ensure OTP is entered
      if (!otp) {
        showToast("Please enter the OTP.", "warning");
        return;
      }
      
      // Send OTP verification request
      $.ajax({
        type: "POST",
        url: "/verify-otp",
        contentType: "application/json",
        data: JSON.stringify({
          name: name,
          email: email,
          rollNumber: rollNumber,
          password: password,
          otp: otp,
        }),
        success: function (response) {
          if (response.success) {
            showToast("User registered successfully!", "success");
            setTimeout(() => {
              window.location.href = "/"; // Redirect to login page
            }, 1500);
          } else {
            showToast(response.message, "error"); // Display error message
          }
        },
        error: function (xhr) {
          showToast("Error: " + (xhr.responseJSON?.message || "Something went wrong."), "error");
        },
      });
      });
      });
      
      
    </script>
  </body>
</html>
