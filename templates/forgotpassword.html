<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
      /* General Styles */
      * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      }
      body {
      background-color: #1e2a38;
      background-image: url("{{ url_for('static', filename='images/bg.jpeg') }}");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      }
      .navbar {
      width: 100%;
      background-color: rgba(36, 52, 71, 0.9);
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      position: fixed;
      top: 0;
      z-index: 10;
      }
      .navbar .logo {
      font-size: 24px;
      font-weight: bold;
      color: #38ef7d;
      text-decoration: none;
      }
      .navbar ul {
      list-style: none;
      display: flex;
      gap: 20px;
      }
      .navbar ul li {
      display: inline-block;
      }
      .navbar ul li a {
      text-decoration: none;
      color: white;
      padding: 10px 15px;
      border-radius: 5px;
      transition: background 0.3s ease;
      }
      .navbar ul li a:hover {
      background: #38ef7d;
      color: #1e2a38;
      }
      .container {
      width: 100%;
      max-width: 500px;
      margin: 100px auto 50px;
      background: rgba(36, 52, 71, 0.9);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: height 0.5s ease-in-out;
      overflow: hidden;
      height: 180px; /* Default Height */
      }
      .container.otp-visible {
      height: 300px; /* Enlarged for OTP */
      }
      .container.password-visible {
      height: 400px; /* Enlarged for Password Reset */
      }
      h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #f3f4f7;
      }
      p {
      text-align: center;
      margin-bottom: 20px;
      }
      .input-group {
      position: relative;
      margin-bottom: 15px;
      }
      .input-group label {
      position: absolute;
      top: 50%;
      left: 10px;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 5px 10px;
      font-size: 14px;
      border-radius: 5px;
      pointer-events: none;
      }
      label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      }
      input {
      width: 100%;
      padding: 10px 10px 10px 50px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.9);
      }
      button {
      width: 100%;
      padding: 10px;
      background-color: #38ef7d;
      color: #1e2a38;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: opacity 0.3s ease-in-out;
      }
      button:hover {
      background-color: #2fc768;
      }
      button.hidden {
      opacity: 0;
      pointer-events: none;
      }
      .redirect-link {
      text-align: center;
      margin-top: 15px;
      }
      .redirect-link a {
      color: #38ef7d;
      text-decoration: none;
      }
      .redirect-link a:hover {
      text-decoration: underline;
      }
      .hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
      transform: translateY(-10px);
      }
      .visible {
      opacity: 1;
      pointer-events: all;
      transform: translateY(0);
      }
      /* Toast Notification Styles */
      .toast-container {
        position: fixed;
        top: 100px;
        right: 20px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .toast {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 16px 20px;
        border-radius: 12px;
        border-left: 4px solid #38ef7d;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 300px;
        max-width: 400px;
        animation: slideInRight 0.4s ease-out;
        position: relative;
      }
      .toast.success {
        border-left-color: #38ef7d;
      }
      .toast.error {
        border-left-color: #ef4444;
      }
      .toast.warning {
        border-left-color: #f59e0b;
      }
      .toast-icon {
        font-size: 24px;
        flex-shrink: 0;
      }
      .toast.success .toast-icon {
        color: #38ef7d;
      }
      .toast.error .toast-icon {
        color: #ef4444;
      }
      .toast.warning .toast-icon {
        color: #f59e0b;
      }
      .toast-message {
        color: #1e2a38;
        font-size: 14px;
        flex: 1;
        line-height: 1.4;
      }
      .toast-close {
        background: none;
        border: none;
        color: #64748b;
        cursor: pointer;
        font-size: 20px;
        padding: 0;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        transition: all 0.2s;
        flex-shrink: 0;
      }
      .toast-close:hover {
        background: rgba(0, 0, 0, 0.1);
        color: #1e2a38;
      }
      @keyframes slideInRight {
        from {
          transform: translateX(400px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      @keyframes slideOutRight {
        from {
          transform: translateX(0);
          opacity: 1;
        }
        to {
          transform: translateX(400px);
          opacity: 0;
        }
      }
      /* Loading Spinner */
      button.loading {
        position: relative;
        pointer-events: none;
        opacity: 0.7;
      }
      button.loading::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        top: 50%;
        left: 50%;
        margin-left: -8px;
        margin-top: -8px;
        border: 2px solid #ffffff;
        border-radius: 50%;
        border-top-color: transparent;
        animation: spinner 0.6s linear infinite;
      }
      @keyframes spinner {
        to {
          transform: rotate(360deg);
        }
      }
      /* Password strength indicator */
      .password-strength {
        margin-top: 5px;
        height: 4px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
        overflow: hidden;
      }
      .password-strength-bar {
        height: 100%;
        width: 0%;
        transition: all 0.3s;
      }
      .password-strength-bar.weak {
        width: 33%;
        background: #ef4444;
      }
      .password-strength-bar.medium {
        width: 66%;
        background: #f59e0b;
      }
      .password-strength-bar.strong {
        width: 100%;
        background: #38ef7d;
      }
      .password-hint {
        font-size: 12px;
        margin-top: 5px;
        color: rgba(255, 255, 255, 0.7);
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <a href="#" class="logo">KIRA</a>
      <ul>
        <li><a href="{{ url_for('chat') }}">Chat</a></li>
        <li><a href="{{ url_for('about') }}">About Us</a></li>
        <li><a href="{{ url_for('contact') }}">Contact</a></li>
      </ul>
    </div>
    <div class="container">
      <h2>Forgot Password</h2>
      <!-- Forgot Password Form -->
      <form id="forgotPasswordForm">
        <div class="input-group">
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <button type="submit">Send OTP</button>
      </form>
      <!-- OTP Verification Box (Initially Hidden) -->
      <div id="otpBox" class="hidden">
        <form id="verifyOtpForm">
          <div class="input-group">
            <input type="text" id="otp" name="otp" placeholder="Enter OTP" required>
          </div>
          <button type="submit">Verify OTP</button>
        </form>
      </div>
      <!-- Reset Password Box (Initially Hidden) -->
      <div id="resetPasswordBox" class="hidden">
        <form id="resetPasswordForm">
          <div class="input-group">
            <input type="password" id="new_password" name="new_password" placeholder="Enter new password (min 8 characters)" required minlength="8">
          </div>
          <div class="password-strength">
            <div class="password-strength-bar" id="strengthBar"></div>
          </div>
          <div class="password-hint" id="passwordHint">
            Password must be at least 8 characters
          </div>
          <button type="submit">Submit</button>
        </form>
      </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
      // Toast notification function
      function showToast(message, type = 'success') {
        const toastContainer = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        
        const icons = {
          success: '✓',
          error: '✕',
          warning: '⚠'
        };
        
        toast.innerHTML = `
          <span class="toast-icon">${icons[type] || icons.success}</span>
          <span class="toast-message">${message}</span>
          <button class="toast-close" onclick="closeToast(this)">×</button>
        `;
        
        toastContainer.appendChild(toast);
        
        // Auto remove after 5 seconds
        setTimeout(() => {
          toast.style.animation = 'slideOutRight 0.4s ease-out';
          setTimeout(() => toast.remove(), 400);
        }, 5000);
      }
      
      function closeToast(button) {
        const toast = button.parentElement;
        toast.style.animation = 'slideOutRight 0.4s ease-out';
        setTimeout(() => toast.remove(), 400);
      }

      // Password strength checker
      function checkPasswordStrength(password) {
        const strengthBar = document.getElementById('strengthBar');
        const passwordHint = document.getElementById('passwordHint');
        
        let strength = 0;
        const hints = [];
        
        if (password.length >= 8) strength++;
        else hints.push('at least 8 characters');
        
        if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
        else hints.push('uppercase & lowercase letters');
        
        if (/\d/.test(password)) strength++;
        else hints.push('numbers');
        
        if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) strength++;
        else hints.push('special characters');
        
        // Update UI
        strengthBar.className = 'password-strength-bar';
        if (strength <= 1) {
          strengthBar.classList.add('weak');
          passwordHint.textContent = 'Weak password. Add: ' + hints.join(', ');
        } else if (strength === 2 || strength === 3) {
          strengthBar.classList.add('medium');
          passwordHint.textContent = 'Medium strength. Consider adding: ' + hints.join(', ');
        } else {
          strengthBar.classList.add('strong');
          passwordHint.textContent = 'Strong password!';
        }
        
        return strength;
      }

      // Add event listener for password input
      document.addEventListener('DOMContentLoaded', function() {
        const newPasswordInput = document.getElementById('new_password');
        if (newPasswordInput) {
          newPasswordInput.addEventListener('input', function(e) {
            checkPasswordStrength(e.target.value);
          });
        }
      });

      document.getElementById("forgotPasswordForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const submitBtn = e.target.querySelector('button');
      
      // Check if email ends with @kiit.ac.in
      if (!email.endsWith("@kiit.ac.in")) {
      showToast("Please enter a valid KIIT email (ending with @kiit.ac.in).", "warning");
      return;
      }
      
      // Add loading state
      submitBtn.classList.add('loading');
      submitBtn.textContent = '';
      
      const response = await fetch("/forgot-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
      });
      
      submitBtn.classList.remove('loading');
      submitBtn.textContent = 'Send OTP';
      
      const data = await response.json();
      if (data.success) {
      showToast(data.message, 'success');
      
      // Hide "Send OTP" button
      document.querySelector("#forgotPasswordForm button").classList.add("hidden");
      
      // Expand container & show OTP box
      document.querySelector(".container").classList.add("otp-visible");
      setTimeout(() => {
          document.getElementById("otpBox").classList.add("visible");
      }, 300);
      } else {
      showToast(data.message, 'error');
      }
      });
      
      
      document.getElementById("verifyOtpForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const otp = document.getElementById("otp").value;
      const email = document.getElementById("email").value;
      const submitBtn = e.target.querySelector('button');
      
      if (!otp || otp.length !== 4) {
        showToast("Please enter a valid 4-digit OTP.", "warning");
        return;
      }
      
      // Add loading state
      submitBtn.classList.add('loading');
      submitBtn.textContent = '';
      
      const response = await fetch("/verify-reset-otp", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, otp }),
      });
      
      submitBtn.classList.remove('loading');
      submitBtn.textContent = 'Verify OTP';
      
      const data = await response.json();
      if (data.success) {
      showToast("OTP Verified! Enter your new password.", 'success');
      
      // Fade out OTP submission button
      document.querySelector("#verifyOtpForm button").classList.add("hidden");
      
      // Expand container & fade in Reset Password box
      document.querySelector(".container").classList.add("password-visible");
      setTimeout(() => {
          document.getElementById("resetPasswordBox").classList.add("visible");
      }, 300);
      } else {
      showToast(data.message || "Invalid OTP! Please try again.", 'error');
      }
      });
      
      document.getElementById("resetPasswordForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("email").value;
          const newPassword = document.getElementById("new_password").value;
          const submitBtn = e.target.querySelector('button');
          
          // Validate password strength
          const strength = checkPasswordStrength(newPassword);
          if (strength < 2) {
            showToast("Please use a stronger password (at least 8 characters with uppercase, lowercase, and numbers).", "warning");
            return;
          }
          
          // Add loading state
          submitBtn.classList.add('loading');
          submitBtn.textContent = '';
      
          const response = await fetch("/reset-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, new_password: newPassword }),
          });
          
          submitBtn.classList.remove('loading');
          submitBtn.textContent = 'Submit';
      
          const data = await response.json();
          if (data.success) {
              showToast("Password changed successfully! Redirecting to login...", 'success');
              setTimeout(() => {
                window.location.href = "{{ url_for('index') }}";
              }, 2000);
          } else {
              showToast(data.message || "Error resetting password. Please try again.", 'error');
          }
      });
    </script>
  </body>
</html>
